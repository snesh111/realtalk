apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtalk-backend
  labels:
    app: realtalk-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtalk-backend
  template:
    metadata:
      labels:
        app: realtalk-backend
    spec:
      containers:
      - name: realtalk-backend
        image: snesh111/real_talk-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: realtalk-secrets
              key: MONGO_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: realtalk-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          value: "7d"
        - name: CLOUDINARY_CLOUD_NAME
          valueFrom:
            secretKeyRef:
              name: realtalk-secrets
              key: CLOUDINARY_CLOUD_NAME
        - name: CLOUDINARY_API_KEY
          valueFrom:
            secretKeyRef:
              name: realtalk-secrets
              key: CLOUDINARY_API_KEY
        - name: CLOUDINARY_API_SECRET
          valueFrom:
            secretKeyRef:
              name: realtalk-secrets
              key: CLOUDINARY_API_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /api/posts
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/posts
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: realtalk-backend-service
spec:
  selector:
    app: realtalk-backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: ClusterIP
